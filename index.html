<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哪座城市最适合你定居</title><style>:root{--bg:#e7eee8;--ink:#203b38;--accent:#27766d;--soft:#f7faf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;transition:background .5s}main{max-width:680px;margin:auto;padding:24px 16px 60px}.card{background:var(--soft);border-radius:28px;padding:clamp(26px,6vw,52px);box-shadow:0 20px 60px #183c301c;min-height:600px;animation:enter .35s ease}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.kicker{letter-spacing:.28em;color:var(--accent);font-size:12px;font-weight:700}.hero{font-family:"Noto Serif SC",serif;font-size:clamp(42px,9vw,72px);line-height:1.2;margin:30px 0}.lead{line-height:1.9;color:#5d716d}.scene{font-size:80px;margin:36px 0}.btn,.option{font:inherit;cursor:pointer}.btn{background:var(--accent);color:white;border:0;border-radius:100px;padding:15px 28px;font-weight:700}.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}.top{display:flex;justify-content:space-between;font-size:13px;color:var(--accent)}.track{height:6px;background:#d6e0da;border-radius:10px;margin:18px 0 48px}.bar{height:100%;background:var(--accent);border-radius:10px;transition:width .3s}h2{font-family:"Noto Serif SC",serif;font-size:clamp(26px,5vw,38px);line-height:1.5}.options{display:grid;gap:12px;margin:32px 0}.option{width:100%;text-align:left;background:white;border:1px solid #d9e4dd;border-radius:15px;padding:18px 20px;color:var(--ink);line-height:1.5;transition:.2s}.option:hover,.option:focus{border-color:var(--accent);transform:translateX(4px)}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:12px;color:#748780}.result{text-align:center}.result .scene{margin:20px 0}.result h1{font-family:"Noto Serif SC",serif;font-si const questions=raw.map((r,i)=>({title:r[0],options:r[1].map((label,j)=>({label,city:weights[i][j]}))}));let at=0,answers=[];const app=document.getElementById('app');function theme(p){document.documentElement.style.setProperty('--bg',p?p.color[0]:'#e7eee8');document.documentElement.style.setProperty('--ink',p?p.color[1]:'#203b38');document.documentElement.style.setProperty('--accent',p?p.color[2]:'#27766d')}function home(){theme();at=0;answers=[];app.innerHTML='<section class="card"><div class="kicker">CITY PERSONALITY TEST · 25 QUESTIONS</div><div class="scene">🏙️</div><h1 class="hero">哪座城市<br>最适合你定居？</h1><p class="lead">从早餐、通勤到周末的风，跟着第一感觉作答。25 个生活片段，找出和你气质相近的城市原型。</p><button class="btn" id="start">开始探索 →</button><p class="share">约 3 分钟 · 仅供趣味娱乐，不作为专业定居建议</p></section>';document.getElementById('start').onclick=show}function show(){let q=questions[at];app.innerHTML='<section class="card"><div class="top"><span>城市生活观察手册</span><span>'+String(at+1).padStart(2,'0')+' / 25</span></div><div class="track"><div class="bar" style="width:'+((at+1)/25*100)+'%"></div></div><div class="kicker">凭第一感觉选择</div><h2>'+q.title+'</h2><div class="options">'+q.options.map((o,j)=>'<button class="option" data-i="'+j+'">'+('ABCD'[j])+'　'+o.label+'</button>').join('')+'</div><div class="nav"><button class="btn secondary" id="back">'+(at?'上一题':'返回首页')+'</button><span class="small">选择后自动进入下一题</span></div></section>';app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{answers[at]=+b.dataset.i;if(at===24)result();else{at++;show()}});document.getElementById('back').onclick=()=>{if(at){at--;show()}else home()}}function score(){let tally=profiles.map(p=>0);answers.forEach((a,i)=>{let target=questions[i].options[a].city;tally[target]+=3;let d=i%7;tally.forEach((_,k)=>{let n=names.length;let affinity=profiles[k].v[d]*profiles[target].v[d];tally[k]+=affinity/n})});return tally.indexOf(Math.max(...tally))}function result(){let p=profiles[score()];theme(p);app.innerHTML='<section class="card result"><div class="kicker">你的城市人格报告</div><div class="scene">'+p.icon+'</div><div class="small">最适合你的城市原型</div><h1>'+p.name+'</h1><div class="cities">代表城市 · '+p.cities+'</div><div class="quote">“'+p.quote+'”</div><div class="details"><div class="detail"><b>你的城市性格画像</b>'+p.portrait+'</div><div class="detail"><b>为什么匹配</b>'+p.why+'</div><div class="detail"><b>隐藏优势</b>'+p.gift+'</div><div class="detail"><b>趣味彩蛋 · 城市冷知识</b>'+p.egg+'</div></div><button class="btn" id="again">重新测试 ↻</button><p class="share">截图分享给朋友，看看你们会住进怎样的城市。<br>趣味测试结果仅供娱乐，不构成定居规划建议。</p></section>';document.getElementById('again').onclick=home;window.scrollTo({top:0,behavior:'smooth'})}home();
